# Netlify: the static site plus one function. Phase 8 is the deploy; this file
# is here from phase 7 because the function's path is part of its contract --
# the page calls /.netlify/functions/ask, and the dev server mounts it there.
#
# The function bundles lib/skill.mjs (SKILL.md as a string, generated by
# web/bundle.py) and lib/budget.mjs, so nothing has to be resolved from disk
# at runtime. Environment on the site: ANTHROPIC_API_KEY (required for live),
# WORKBENCH_DAILY_CAP_USD (default 5), WORKBENCH_IP_CAP (default 40),
# WORKBENCH_SIGNING_SECRET (optional; derived from the key otherwise).

[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
